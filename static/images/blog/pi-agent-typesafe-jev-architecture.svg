<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600"
  viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent와 TypeSafe Jev 상호작용 아키텍처</title>
  <desc id="desc">
    터미널 기반 코딩 에이전트 Pi Agent가 파일을 수정하고 테스트를 실행하면, 비-자기회귀 의사결정 모델 TypeSafe Jev가 500ms 만에 Choice, Noul, Score로 객관적인 검증 피드백을 반환하는 협력 루프.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
      orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--edge)" />
    </marker>
    <marker id="purple-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
      orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--agent-accent)" />
    </marker>
    <marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
      orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--jev-accent)" />
    </marker>
    <marker id="green-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4"
      orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="var(--feedback-edge)" />
    </marker>
    <style>
      :root {
        --canvas: #f8fafc;
        --text: #0f172a;
        --muted: #475569;
        --node: #ffffff;
        --border: #cbd5e1;
        --edge: #64748b;
        --agent-box: #f5f3ff;
        --agent-border: #ddd6fe;
        --agent-accent: #7c3aed;
        --jev-box: #eff6ff;
        --jev-border: #bfdbfe;
        --jev-accent: #2563eb;
        --feedback-edge: #059669;
        --pill-bg: #e2e8f0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0f172a;
          --text: #f1f5f9;
          --muted: #94a3b8;
          --node: #1e293b;
          --border: #334155;
          --edge: #94a3b8;
          --agent-box: #2e106522;
          --agent-border: #7c3aed44;
          --agent-accent: #a78bfa;
          --jev-box: #17255422;
          --jev-border: #3b82f644;
          --jev-accent: #60a5fa;
          --feedback-edge: #34d399;
          --pill-bg: #1e293b;
        }
      }
      text {
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Noto Sans KR', sans-serif;
        fill: var(--text);
      }
      .heading {
        font-size: 19px;
        font-weight: 700;
      }
      .subheading {
        font-size: 13px;
        fill: var(--muted);
      }
      .node-title {
        font-size: 15px;
        font-weight: 600;
      }
      .node-desc {
        font-size: 12px;
        fill: var(--muted);
      }
      .badge-text {
        font-size: 11px;
        font-weight: 700;
        text-anchor: middle;
      }
      .edge-label {
        font-size: 11px;
        font-weight: 600;
        text-anchor: middle;
        fill: var(--muted);
      }
      .edge {
        fill: none;
        stroke: var(--edge);
        stroke-width: 1.5;
        marker-end: url(#arrow);
      }
      .edge-agent {
        stroke: var(--agent-accent);
        marker-end: url(#purple-arrow);
      }
      .edge-feedback {
        stroke: var(--feedback-edge);
        stroke-width: 2;
        stroke-dasharray: 6 4;
        marker-end: url(#green-arrow);
      }
    </style>
  </defs>

  <!-- 캔버스 배경 -->
  <rect width="1040" height="600" rx="14" fill="var(--canvas)" />

  <!-- 1. 좌측 컨테이너: Pi Agent -->
  <rect x="36" y="32" width="440" height="536" rx="16"
    fill="var(--agent-box)" stroke="var(--agent-border)" stroke-width="1.5" />

  <!-- Pi Agent 헤더 -->
  <rect x="56" y="52" width="115" height="24" rx="12" fill="var(--agent-accent)" opacity="0.15" />
  <text x="113" y="68" class="badge-text" fill="var(--agent-accent)">GENERATOR</text>
  <text x="56" y="104" class="heading" fill="var(--agent-accent)">🤖 Pi Agent (코딩 실행기)</text>
  <text x="56" y="124" class="subheading">터미널 환경에서 자율적으로 파일 수정과 테스트를 수행하는 실행 주체</text>

  <!-- Pi Agent 노드 1: 터미널 CLI -->
  <rect x="56" y="148" width="400" height="96" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="76" y="180" class="node-title">1. 터미널 인터페이스 (/new, /typesafe enable)</text>
  <text x="76" y="202" class="node-desc">• 대화형 REPL 세션 초기화 및 프롬프트 주입</text>
  <text x="76" y="222" class="node-desc">• TypeSafe Jev MCP 도구 런타임 마운트</text>

  <!-- Pi Agent 노드 2: 코드 리팩터링 -->
  <rect x="56" y="268" width="400" height="114" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="76" y="298" class="node-title">2. 코드 리팩터링 &amp; 파일 수정 (Coder)</text>
  <text x="76" y="320" class="node-desc">• 1,478줄 SellPage.vue 모놀리스 분해</text>
  <text x="76" y="340" class="node-desc">• useZeroStockWarning, useSellLocationSync 적출</text>
  <text x="76" y="360" class="node-desc">• Vue 3 Composable 및 모달 컴포넌트 격리</text>

  <!-- Pi Agent 노드 3: 로컬 테스트 실행 -->
  <rect x="56" y="406" width="400" height="138" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="76" y="436" class="node-title">3. 로컬 테스트 및 전수 검증 (Runner)</text>
  <text x="76" y="458" class="node-desc">• Vitest 단위 테스트 실행 (엔터 키 스킵 등)</text>
  <text x="76" y="478" class="node-desc">• Deno 2 ambient 권한 및 DB 스크립트 실행</text>
  <text x="76" y="498" class="node-desc">• pnpm validate (291개 테스트 FULL TURBO 달성)</text>

  <!-- 2. 우측 컨테이너: TypeSafe Jev 1.13.0 -->
  <rect x="564" y="32" width="440" height="536" rx="16"
    fill="var(--jev-box)" stroke="var(--jev-border)" stroke-width="1.5" />

  <!-- Jev 헤더 -->
  <rect x="584" y="52" width="130" height="24" rx="12" fill="var(--jev-accent)" opacity="0.15" />
  <text x="649" y="68" class="badge-text" fill="var(--jev-accent)">DISCRIMINATOR</text>
  <text x="584" y="104" class="heading" fill="var(--jev-accent)">⚖️ TypeSafe Jev 1.13.0 (의사결정 판관)</text>
  <text x="584" y="124" class="subheading">&lt; 500ms 비-자기회귀 인퍼런스 · 아첨 없는 차가운 확률 기반 즉결 심판</text>

  <!-- Jev 메인 게이트웨이 -->
  <rect x="584" y="148" width="400" height="96" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="604" y="180" class="node-title" fill="var(--jev-accent)">typesafe_evaluate (MCP 도구 게이트웨이)</text>
  <text x="604" y="202" class="node-desc">• 수정 전후 상태(State)와 정밀 질문(Questions) 수신</text>
  <text x="604" y="222" class="node-desc">• 단일 텐서 패스로 보정된 확률 분포(Calibrated Bounds) 산출</text>

  <!-- Jev 모듈 1: Choice -->
  <rect x="584" y="264" width="400" height="84" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="604" y="294" class="node-title">🎯 Choice: 다중 선택 분기 판별</text>
  <text x="604" y="316" class="node-desc">• 후보군 확률화: merge_ready (0.991) 판정</text>
  <text x="604" y="334" class="node-desc">• 권한 누락/타입 결함 시 즉시 차단</text>

  <!-- Jev 모듈 2: Noul -->
  <rect x="584" y="364" width="400" height="84" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="604" y="394" class="node-title">✨ Noul: 명제 참/거짓 진리 확률</text>
  <text x="604" y="416" class="node-desc">• 불변식 검증: "엔터 키로 팝업 우회 보장?"</text>
  <text x="604" y="434" class="node-desc">• 진리 확률: 0.985 (True, bounds [0.971, 0.994])</text>

  <!-- Jev 모듈 3: Score -->
  <rect x="584" y="464" width="400" height="84" rx="12"
    fill="var(--node)" stroke="var(--border)" stroke-width="1.5" />
  <text x="604" y="494" class="node-title">📊 Score: 객관적 루브릭 품질 채점</text>
  <text x="604" y="516" class="node-desc">• 0.0 ~ 2.0 척도: 관심사 분리도 2.0 / 거스름돈 결함 1.34</text>
  <text x="604" y="534" class="node-desc">• 아첨 없이 잠재 버그(props 리액티비티 누락) 적발</text>

  <!-- 중앙 연결 흐름선들 -->
  <!-- 1. CLI -> typesafe_evaluate (마운트) -->
  <path d="M 456 180 L 584 180" class="edge edge-agent" />

  <!-- 2. Coder -> typesafe_evaluate (State 전송) -->
  <path d="M 456 300 C 510 300, 530 215, 584 215" class="edge" />

  <!-- 3. typesafe_evaluate -> Coder (피드백 리턴) -->
  <path d="M 584 195 C 520 195, 510 330, 456 330" class="edge-feedback" />

  <!-- 4. Runner -> typesafe_evaluate (검증 팩트) -->
  <path d="M 456 460 C 530 460, 520 230, 584 230" class="edge" />

  <!-- 중앙 라벨 배지들 -->
  <!-- 라벨 1: 활성화 -->
  <rect x="475" y="168" width="90" height="20" rx="10" fill="var(--node)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="182" class="edge-label" fill="var(--agent-accent)">/typesafe enable</text>

  <!-- 라벨 2: State 전송 -->
  <rect x="470" y="248" width="100" height="20" rx="10" fill="var(--node)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="262" class="edge-label">State 전송 ➔</text>

  <!-- 라벨 3: 판결 피드백 -->
  <rect x="466" y="325" width="108" height="20" rx="10" fill="var(--node)" stroke="var(--feedback-edge)" stroke-width="1" />
  <text x="520" y="339" class="edge-label" fill="var(--feedback-edge)">◀ 500ms 판결</text>

  <!-- 라벨 4: 테스트 팩트 -->
  <rect x="470" y="415" width="100" height="20" rx="10" fill="var(--node)" stroke="var(--border)" stroke-width="1" />
  <text x="520" y="429" class="edge-label">테스트 팩트 ➔</text>
</svg>

