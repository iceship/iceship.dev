<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
  viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#262626" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Border Card -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none"
    stroke="#262626" stroke-width="2" />

  <!-- Brand Chip -->
  <g transform="translate(100, 110)">
    <rect width="150" height="36" rx="18" fill="#171717" stroke="#333333"
      stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="35" y="23" fill="#e5e5e5"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="14" font-weight="600">Fresh 2 · Deno</text>
  </g>

  <!-- Title -->
  <text x="100" y="270" fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="72" font-weight="800" letter-spacing="-2">iceship.dev</text>

  <!-- Accent Line -->
  <rect x="100" y="310" width="80" height="4" rx="2" fill="url(#line)" />

  <!-- Description -->
  <text x="100" y="380" fill="#d4d4d4"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="32" font-weight="500">미니멀 개인 기술 블로그</text>
  <text x="100" y="430" fill="#737373"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="22" font-weight="400">Zero Client JS · Fast SSR · Markdown</text>

  <!-- Footer Domain -->
  <text x="100" y="520" fill="#525252"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="20" font-weight="500">https://iceship.dev</text>
</svg>
