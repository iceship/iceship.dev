name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # Deno Deploy OIDC 인증
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install

      - name: Check code (format, lint, typecheck)
        run: deno task check

      - name: Build project (Vite)
        run: deno task build

      - name: Deploy to Deno Deploy
        uses: denoland/deployctl@v1
        if: github.ref == 'refs/heads/main'
        with:
          project: blog-iceship-dev
          entrypoint: _fresh/server.js
